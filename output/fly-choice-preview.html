&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;fly-choice-app&#x27;);
  const el = id =&gt; root.querySelector(&#x27;#&#x27;+id);
  const presets = {
    hungry:{text:&#x27;แมลงวันหิวจัด อาหารใกล้หมด ต้องการอาหารมากกว่าที่หลบภัย&#x27;,weights:{food:2.2,shelter:.5,danger:1},hint:&#x27;กติกาตัวอย่าง: ให้น้ำหนักอาหารสูง&#x27;},
    fearful:{text:&#x27;แมลงวันกลัวอันตราย ต้องการความปลอดภัยและที่หลบภัยเป็นหลัก&#x27;,weights:{food:.65,shelter:1.4,danger:2.3},hint:&#x27;กติกาตัวอย่าง: ให้น้ำหนักการหลีกเลี่ยงอันตรายสูง&#x27;},
    balanced:{text:&#x27;แมลงวันต้องการอาหาร ที่หลบภัย และความปลอดภัยอย่างสมดุล&#x27;,weights:{food:1,shelter:.9,danger:1.4},hint:&#x27;กติกาตัวอย่าง: ชั่งอาหาร ที่หลบภัย และอันตรายร่วมกัน&#x27;}
  };
  const rules = [
    {rx:/แจก(?:อาหาร|ผลไม้|กล้วย)|(?:อาหาร|ผลไม้|กล้วย)ฟรี|free food|free fruit|free bananas/ig,dim:&#x27;food&#x27;,amount:2,label:&#x27;เพิ่มอาหาร&#x27;},
    {rx:/เปิดถังขยะ|เพิ่มอาหาร|ลดค่าอาหาร|เพิ่มแหล่งอาหาร/ig,dim:&#x27;food&#x27;,amount:1,label:&#x27;เพิ่มอาหาร&#x27;},
    {rx:/(?&lt;!เ)ปิดถังขยะ|ลดเศษอาหาร|จำกัดอาหาร|เก็บขยะมิดชิด|remove food|less food/ig,dim:&#x27;food&#x27;,amount:-2,label:&#x27;ลดอาหาร&#x27;},
    {rx:/เพิ่มที่หลบภัย|สร้างที่หลบภัย|เพิ่มแหล่งพัก|more shelter|safe shelter/ig,dim:&#x27;shelter&#x27;,amount:2,label:&#x27;เพิ่มที่หลบภัย&#x27;},
    {rx:/ลดที่หลบภัย|รื้อที่หลบภัย|remove shelter/ig,dim:&#x27;shelter&#x27;,amount:-2,label:&#x27;ลดที่หลบภัย&#x27;},
    {rx:/ลด(?:การใช้)?ยาฆ่าแมลง|ลดไม้ตีแมลงวัน|ลดกับดัก|ห้ามใช้ยาฆ่าแมลง|less pesticide/ig,dim:&#x27;danger&#x27;,amount:-2,label:&#x27;ลดอันตราย&#x27;},
    {rx:/เพิ่มไม้ตี(?:แมลงวัน)?|เพิ่มกับดัก|ฉีดยาฆ่าแมลง|เพิ่ม(?:การใช้)?ยาฆ่าแมลง|กำจัดแมลงวัน|more pesticide/ig,dim:&#x27;danger&#x27;,amount:2,label:&#x27;เพิ่มอันตราย&#x27;}
  ];
  const fields=[&#x27;fc-state&#x27;,&#x27;fc-name-a&#x27;,&#x27;fc-name-b&#x27;,&#x27;fc-policy-a&#x27;,&#x27;fc-policy-b&#x27;,&#x27;fc-source-a&#x27;,&#x27;fc-source-b&#x27;];
  let lastResult = null;
  function readInputs() { return Object.fromEntries(fields.map(id=&gt;[id,el(id).value])); }
  function remember() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{prototype:&#x27;fly-choice-text-mock&#x27;,input:readInputs(),persona:el(&#x27;fc-persona&#x27;).value,result:lastResult},privateContent:{traceOpen:root.querySelector(&#x27;.fc-trace&#x27;).open,jsonOpen:root.querySelector(&#x27;.fc-json&#x27;).open}}).catch(()=&gt;{});
  }
  function restore(snapshot) {
    const c=snapshot?.modelContent;if(c?.prototype!==&#x27;fly-choice-text-mock&#x27;)return;
    if(c.input)fields.forEach(id=&gt;{if(typeof c.input[id]===&#x27;string&#x27;)el(id).value=c.input[id].slice(0,el(id).maxLength);});
    if([&#x27;hungry&#x27;,&#x27;fearful&#x27;,&#x27;balanced&#x27;,&#x27;custom&#x27;].includes(c.persona))el(&#x27;fc-persona&#x27;).value=c.persona;
    const p=snapshot.privateContent;if(p){root.querySelector(&#x27;.fc-trace&#x27;).open=p.traceOpen!==false;root.querySelector(&#x27;.fc-json&#x27;).open=!!p.jsonOpen;}
    updateStateHint();
  }
  function stateContext() {
    const p=el(&#x27;fc-persona&#x27;).value;
    if(presets[p])return {...presets[p],key:p};
    const t=el(&#x27;fc-state&#x27;).value;
    if(/กลัว|อันตราย|ปลอดภัย|fear|danger/i.test(t))return {...presets.fearful,key:&#x27;custom-fearful&#x27;};
    if(/หิว|ขาดอาหาร|อาหารใกล้หมด|hungry|starving/i.test(t))return {...presets.hungry,key:&#x27;custom-hungry&#x27;};
    return {...presets.balanced,key:&#x27;custom-balanced&#x27;};
  }
  function updateStateHint(){el(&#x27;fc-state-hint&#x27;).textContent=(el(&#x27;fc-persona&#x27;).value===&#x27;custom&#x27;?&#x27;จับคำในสถานการณ์ · &#x27;:&#x27;&#x27;)+stateContext().hint;}
  function encode(text) {
    const impact={food:0,shelter:0,danger:0},matches=[];
    for(const r of rules){r.rx.lastIndex=0;let m;while((m=r.rx.exec(text))!==null){matches.push({phrase:m[0],dimension:r.dim,change:r.amount,label:r.label});impact[r.dim]+=r.amount;}}
    for(const dim of Object.keys(impact))impact[dim]=Math.max(-2,Math.min(2,impact[dim]));
    return {impact,matches};
  }
  function stale(){if(lastResult)el(&#x27;fc-run-state&#x27;).textContent=&#x27;ข้อความเปลี่ยนแล้ว · กดเลือกใหม่เพื่ออัปเดต&#x27;;}
  function validate(){
    const fail=msg=&gt;{el(&#x27;fc-error&#x27;).hidden=false;el(&#x27;fc-error&#x27;).textContent=msg;return false;};
    if(!el(&#x27;fc-state&#x27;).value.trim())return fail(&#x27;ใส่สถานการณ์ของแมลงวันก่อนครับ&#x27;);
    for(const p of [&#x27;a&#x27;,&#x27;b&#x27;]){
      if(!el(&#x27;fc-name-&#x27;+p).value.trim())return fail(&#x27;ใส่ชื่อให้ครบทั้งสองตัวเลือก&#x27;);
      if(!el(&#x27;fc-policy-&#x27;+p).value.trim())return fail(&#x27;วางข้อความนโยบายให้ครบทั้งสองฝั่ง — mock นี้ยังอ่านนโยบายจาก URL ไม่ได้&#x27;);
      const source=el(&#x27;fc-source-&#x27;+p).value.trim();if(source){try{const url=new URL(source);if(![&#x27;http:&#x27;,&#x27;https:&#x27;].includes(url.protocol))throw Error();}catch{return fail(&#x27;ลิงก์อ้างอิงต้องขึ้นต้นด้วย https:// หรือ http://&#x27;);}}
    }
    el(&#x27;fc-error&#x27;).hidden=true;return true;
  }
  function renderTrace(options){
    const container=el(&#x27;fc-trace-content&#x27;);container.replaceChildren();
    options.forEach(o=&gt;{
      const group=document.createElement(&#x27;div&#x27;);group.className=&#x27;fc-trace-group&#x27;;
      const heading=document.createElement(&#x27;div&#x27;);heading.className=&#x27;fc-trace-title&#x27;;
      const name=document.createElement(&#x27;span&#x27;);name.textContent=o.key+&#x27; · &#x27;+o.name;
      const score=document.createElement(&#x27;span&#x27;);score.textContent=&#x27;คะแนน mock &#x27;+o.score.toFixed(2);heading.append(name,score);group.append(heading);
      if(!o.matches.length){const none=document.createElement(&#x27;div&#x27;);none.className=&#x27;fc-unknown&#x27;;none.textContent=&#x27;ไม่มีวลีตรงกับกติกา — ไม่ได้แปลว่าพรรคนี้ไม่มีนโยบายที่ดี&#x27;;group.append(none);}
      o.matches.forEach(m=&gt;{const row=document.createElement(&#x27;div&#x27;);row.className=&#x27;fc-match&#x27;;const tag=document.createElement(&#x27;span&#x27;);tag.className=&#x27;fc-impact&#x27;+((m.dimension===&#x27;danger&#x27;&amp;&amp;m.change&gt;0)||(m.dimension!==&#x27;danger&#x27;&amp;&amp;m.change&lt;0)?&#x27; fc-risk&#x27;:&#x27;&#x27;);tag.textContent=m.label;const quote=document.createElement(&#x27;q&#x27;);quote.textContent=m.phrase;row.append(tag,quote);group.append(row);});
      container.append(group);
    });
  }
  function run(initial=false){
    if(!validate())return;
    const context=stateContext(),weights=context.weights;
    const options=[&#x27;a&#x27;,&#x27;b&#x27;].map(p=&gt;{const data=encode(el(&#x27;fc-policy-&#x27;+p).value);return {key:p.toUpperCase(),name:el(&#x27;fc-name-&#x27;+p).value.trim(),source:el(&#x27;fc-source-&#x27;+p).value.trim()||null,...data,score:Number((data.impact.food*weights.food+data.impact.shelter*weights.shelter-data.impact.danger*weights.danger).toFixed(2))};});
    const [a,b]=options;
    let choice=&#x27;abstain&#x27;,basis=&#x27;&#x27;;
    if(!a.matches.length||!b.matches.length)basis=&#x27;กติกาอ่านนโยบายได้ไม่ครบทั้งสองฝั่ง จึงยังเปรียบเทียบไม่ได้&#x27;;
    else if(Math.max(a.score,b.score)&lt;=.4)basis=&#x27;ทั้งสองตัวเลือกได้คะแนนตามกติกาต่ำ จึงงดออกเสียง&#x27;;
    else if(Math.abs(a.score-b.score)&lt;.45)basis=&#x27;คะแนนตามกติกาใกล้กันเกินไป จึงงดออกเสียง&#x27;;
    else {choice=a.score&gt;b.score?&#x27;A&#x27;:&#x27;B&#x27;;basis=&#x27;ตามกติกา mock ในสถานการณ์นี้ &#x27;+options.find(o=&gt;o.key===choice).name+&#x27; ได้คะแนนสูงกว่า&#x27;;}
    const picked=options.find(o=&gt;o.key===choice);
    el(&#x27;fc-winner&#x27;).textContent=picked?&#x27;เลือก&#x27;+picked.name:&#x27;งดออกเสียง&#x27;;
    el(&#x27;fc-choice-label&#x27;).textContent=&#x27;choice: &quot;&#x27;+choice+&#x27;&quot;&#x27;;
    el(&#x27;fc-run-state&#x27;).textContent=initial?&#x27;ผลจากตัวอย่างเริ่มต้น&#x27;:&#x27;ผลจากข้อความที่คุณส่ง · mock&#x27;;
    el(&#x27;fc-reason&#x27;).textContent=basis;
    el(&#x27;fc-booth-a&#x27;).textContent=a.name;el(&#x27;fc-booth-b&#x27;).textContent=b.name;
    el(&#x27;fc-arena&#x27;).setAttribute(&#x27;aria-label&#x27;,&#x27;ภาพประกอบผลกติกา mock: &#x27;+(picked?picked.name:&#x27;งดออกเสียง&#x27;));
    const fly=root.querySelector(&#x27;.fc-fly&#x27;);if(initial)fly.style.transition=&#x27;none&#x27;;else fly.style.removeProperty(&#x27;transition&#x27;);fly.style.left=choice===&#x27;A&#x27;?&#x27;16.66%&#x27;:choice===&#x27;B&#x27;?&#x27;83.33%&#x27;:&#x27;50%&#x27;;fly.style.transform=&#x27;translateX(-50%) rotate(&#x27;+(choice===&#x27;A&#x27;?-18:choice===&#x27;B&#x27;?18:0)+&#x27;deg)&#x27;;
    root.querySelectorAll(&#x27;[data-booth]&#x27;).forEach(booth=&gt;booth.classList.toggle(&#x27;fc-chosen&#x27;,booth.dataset.booth===choice));
    el(&#x27;fc-headline&#x27;).textContent=!picked?&#x27;ผู้มีสิทธิ์ยังไม่ปักใจ ขอวนดูถังขยะก่อน&#x27;:context.key.includes(&#x27;hungry&#x27;)?&#x27;แมลงวันเลือก&#x27;+picked.name+&#x27; หลังท้องร้องแทรกการดีเบต&#x27;:context.key.includes(&#x27;fearful&#x27;)?&#x27;ผู้มีสิทธิ์เลือก&#x27;+picked.name+&#x27; ยืนยันต้องรอดก่อนถึงจะเลือกตั้งครั้งหน้าได้&#x27;:&#x27;แมลงวันเลือก&#x27;+picked.name+&#x27; พร้อมขอให้รับรองสิทธิ์เกาะผลไม้&#x27;;
    renderTrace(options);
    lastResult={engine:&#x27;mock-rules-v1&#x27;,brain_loaded:false,jev_called:false,choice,selected_name:picked?.name||null,state_profile:context.key,decision_basis:basis,scores:Object.fromEntries(options.map(o=&gt;[o.key,o.score])),scores_are_probabilities:false};
    el(&#x27;fc-json-output&#x27;).textContent=JSON.stringify(lastResult,null,2);
    if(!initial)remember();
  }
  el(&#x27;fc-form&#x27;).addEventListener(&#x27;submit&#x27;,event=&gt;{event.preventDefault();run();});
  el(&#x27;fc-persona&#x27;).addEventListener(&#x27;change&#x27;,()=&gt;{const p=presets[el(&#x27;fc-persona&#x27;).value];if(p)el(&#x27;fc-state&#x27;).value=p.text;updateStateHint();stale();remember();});
  fields.forEach(id=&gt;{el(id).addEventListener(&#x27;input&#x27;,()=&gt;{if(id===&#x27;fc-state&#x27;){el(&#x27;fc-persona&#x27;).value=&#x27;custom&#x27;;updateStateHint();}stale();});el(id).addEventListener(&#x27;change&#x27;,remember);});

      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
